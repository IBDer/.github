name: "Bug report / Bug 报告"
description: "Report a reproducible problem in an IBDer project. / 报告 IBDer 项目中可复现的问题。"
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include real patient data, medical records, credentials, or security-sensitive details. Use **Security → Report a vulnerability** for private security or safety reports.

        请勿提交真实患者数据、医疗记录、凭证或安全敏感信息。涉及安全或隐私的问题请使用 **Security → Report a vulnerability** 私密报告。
  - type: textarea
    id: problem
    attributes:
      label: "Problem / 问题"
      description: "What happened, and what did you expect? / 实际发生了什么？你原本期待什么？"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Reproduction / 复现方式"
      description: "Use synthetic or redacted data only. / 只能使用合成数据或脱敏数据。"
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version or commit / 版本或提交"
  - type: textarea
    id: environment
    attributes:
      label: "Environment / 环境"
      description: "Operating system, browser, runtime, or device when relevant. / 如适用，请说明操作系统、浏览器、运行环境或设备。"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy check / 隐私确认"
      options:
        - label: "I have removed personal health information, medical records, credentials, and private communications. / 我已移除个人健康信息、医疗记录、凭证和私人通信。"
          required: true

