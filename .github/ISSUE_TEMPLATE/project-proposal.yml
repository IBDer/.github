name: "Project proposal / 项目提案"
description: "Propose an open-source tool, specification, or integration. / 提议开源工具、规范或集成。"
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem. A project should not require identifiable patient data or make unsupported clinical claims.

        请从用户问题开始。项目不应依赖可识别的患者数据，也不应作出缺乏证据的临床主张。
  - type: textarea
    id: problem
    attributes:
      label: "User problem / 用户问题"
      description: "Who experiences the problem, and in what situation? / 谁在什么情况下遇到了这个问题？"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Desired outcome / 期望结果"
      description: "Describe the outcome without prescribing an implementation. / 描述期望结果，不必先限定实现方式。"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Project type / 项目类型"
      options:
        - "Patient tool / 患者工具"
        - "Research infrastructure / 调研基础设施"
        - "Open specification / 开放规范"
        - "Integration / 集成"
        - "Documentation or accessibility / 文档或可访问性"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence or references / 依据或参考资料"
  - type: textarea
    id: risks
    attributes:
      label: "Privacy, safety, and misuse risks / 隐私、安全与误用风险"
      description: "What could go wrong, and how could the risk be limited? / 可能出现什么问题？如何降低风险？"
    validations:
      required: true

